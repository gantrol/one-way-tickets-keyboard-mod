# ============================================================================
# 《再再启程 One Way Tickets》 双手人体工学键盘 Mod 配置文件
# 修改后可在游戏中按 F10 热重载配置，按 F9 切换屏幕快捷键提示开关
# 鼠标原生操作 100% 保留不变，以下所有快捷键均为双手键盘增强操作
# ============================================================================

[LeftHand_WeaponsAndDriving]
# 左手主排 (A S D F G)：固定 1-5 号武器槽位主操作（最常用放主排）
#   - 点按/按住 A-G：主操作 + 智能闭环（攻击/开火/空仓装填/蓄力）
#   - Ctrl + A-G（或 Tab 全开）：切换武器【自动托管 [AUTO]】
#   - Shift + A-G：独立副操作 2 | Alt + A-G：独立副操作 3
WeaponSlotKeys = A, S, D, F, G
GlobalAutoFireToggleKey = Tab

# 左手上排 (Q W E R T)：固定 1-5 号槽位一键定点抢修（与下方 A-G 一一对应）
SlotMaintainKeys = Q, W, E, R, T

# 左手下排 (Z X C)：刹车、灵能加速/冲刺、车轮槽保留键
BrakeKey = Z
PsionicBoostKey = X
WheelSlotKey = C
ManualPlayerAbility = 1.0

[RightHand_Toolbox]
# 右手主排 (H J K L ;)：工具箱专项操作（最常用放主排，自动拎出工具并放回）
#   - H：扳手 / 车载维修包
#   - J：灭火器
#   - K：手锯 / 剪刀 / 电锯（自动优先切最外层藤蔓）
#   - L：抹布 / 拖把 / 吹风筒（吹风筒阶段自动全车吹干）
#   - Semicolon (;)：唤醒工具 / 除颤仪 AED（AED 阶段自动全车唤醒）
#   - Space（空格）：全局智能一键抢修
ToolWrenchKey = H
ToolExtinguisherKey = J
ToolSawKey = K
ToolRagKey = L
ToolWakeUpKey = Semicolon
GlobalSmartMaintainKey = Space
EnableToolPullOutAnimation = true

[RightHand_Characters]
# 右手上排 (Y U I O P [)：1-6 号角色选择与派驻（同时兼容数字键 1-6）
#   - 按 Y-[（或 1-6）选中角色 -> 再按左手 A-G（或 Q-T）派驻到对应槽位工位
#   - 按 '（分号右侧引号键）或 ]：一键智能最优分配所有人物（Ctrl+' 切换持续自动分配托管）
#   - 双击角色键或按 Backspace / 0：撤回角色休息 | Alt + 角色键：与替补轮换
CharacterKeys = Y, U, I, O, P, LeftBracket
CharacterAltKeys = Digit1, Digit2, Digit3, Digit4, Digit5, Digit6
CharacterAutoAssignKey = Quote
CharacterAutoAssignAltKey = RightBracket
CharacterRecallKey = Backspace
CharacterRecallAltKey = Digit0
AutoClearCharacterSelectionAfterAssign = true
DoubleTapRecallSeconds = 0.35

[HUD]
ShowHudOverlay = true
ToggleHudOverlayKey = F9
ReloadConfigKey = F10
