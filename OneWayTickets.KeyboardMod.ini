# ============================================================================
# 《再再启程 One Way Tickets》 全键盘矩阵控制 Mod 配置文件
# 修改后可在游戏中按 F10 热重载配置，按 F9 切换屏幕快捷键提示开关
# 鼠标原生操作 100% 保留不变，以下所有快捷键均为纯键盘增强操作
# ============================================================================

[Characters]
# 第一排：角色选择键 (1-6) 与撤回键 (0 / Backspace)
# 用法：按 1-6 选中角色 -> 再按 Q-Y 派驻到对应武器工位；双击 1-6 或按 0/Backspace 撤回；Alt+1-6 替补轮换
CharacterKeys = Digit1, Digit2, Digit3, Digit4, Digit5, Digit6
CharacterRecallKey = Digit0
CharacterRecallAltKey = Backspace
AutoClearCharacterSelectionAfterAssign = true
DoubleTapRecallSeconds = 0.35

[Weapons]
# 第二排：武器/设备槽位键 (Q W E R T Y，从左到右对应 1-6 号位)
# 用法：
#   - 按住 Q-Y：主操作 + 智能循环（自动索敌旋转 + 开火攻击 + 空仓自动装填 + 蓄力）
#   - Ctrl + Q-Y：切换该槽位武器【后台自动开火/自动装填托管 [AUTO]】
#   - Tab：一键切换所有武器【全局自动托管】
#   - Shift + Q-Y：独立操作 2（手动提前装填 / 投矛远程投掷 / 大剑磨刀 / 箭袋切换 / 战鼓右槌）
#   - Alt + Q-Y：独立操作 3（加特林搬运弹药 / 火炮与绞盘手摇旋转 / 左轮退弹）
WeaponSlotKeys = Q, W, E, R, T, Y
GlobalAutoFireToggleKey = Tab
ManualPlayerAbility = 1.0

[Toolbox]
# 第三排：按槽位直接维护键 (A S D F G H，与上方 Q W E R T Y 垂直对齐)
# 用法：按住 A-H 直接对上方对应槽位设备执行【修缮破损 / 灭火 / 安全剪除最上层藤蔓 / 擦水擦酸 / 拍醒停滞】
SlotMaintainKeys = A, S, D, F, G, H

# 第四排：按工具类别维护键 (Z X C V B) 与全局智能抢修键 (Space)
#   - Z (扳手)：自动修缮全车破损设备
#   - X (灭火器)：自动扑灭全车着火设备
#   - C (锯子/剪刀)：自动安全切除全车最表层藤蔓（不触发底层藤蔓扣血惩罚）
#   - V (抹布/拖把)：自动擦除全车水滴与酸液
#   - B (唤醒工具)：自动唤醒全车昏迷角色（也可按住 B + 1-6 指定唤醒某位角色）
#   - Space (空格)：全局智能抢修（按住空格自动按紧急度处理全车所有异常与昏迷！）
ToolWrenchKey = Z
ToolExtinguisherKey = X
ToolSawKey = C
ToolRagKey = V
ToolWakeUpKey = B
GlobalSmartMaintainKey = Space

[System]
ToggleHudOverlayKey = F9
ReloadConfigKey = F10
ShowHudOverlay = true
